<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>vlitejs YouTube Player</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- vlitejs CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vlitejs@4/dist/vlite.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Responsive video player container with strict clipping for 5% zoom */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }

        /* 5% Zoom applied to crop YouTube branding overlays */
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scale(1.05);
            transform-origin: center center;
            pointer-events: auto;
        }

        /* vlitejs custom theme tweaks */
        .vlite-js {
            --vlite-primaryColor: #6366f1;
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <div class="max-w-4xl w-full flex flex-col items-center gap-6">

        <header class="text-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white mb-1">vlitejs YouTube Player</h1>
            <p class="text-slate-400 text-sm">Lightweight • 5% Edge Zoom • iOS Inline Playback</p>
        </header>

        <div class="w-full video-wrapper">
            <div id="player" data-youtube-id="c8zq4kAn_O0"></div>
        </div>

        <div class="w-full bg-slate-800/60 backdrop-blur rounded-lg p-4 border border-slate-700/50 text-sm text-slate-300 flex items-center justify-between">
            <span class="font-medium text-slate-200">Powered by vlitejs</span>
            <span class="text-xs bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2.5 py-1 rounded">Clean Embed</span>
        </div>

    </div>

    <!-- vlitejs Core & YouTube Provider -->
    <script src="https://cdn.jsdelivr.net/npm/vlitejs@4/dist/vlite.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vlitejs@4/dist/providers/youtube.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Register YouTube provider for vlitejs
            Vlitejs.registerProvider('youtube', VlitejsYoutube);

            // Initialize vlitejs player
            const player = new Vlitejs('#player', {
                options: {
                    controls: true,
                    autoplay: false,
                    playPause: true,
                    progressBar: true,
                    time: true,
                    volume: true,
                    fullscreen: true,
                    poster: '',
                    bigPlay: true,
                    playsinline: true
                },
                providerOptions: {
                    ytcontrols: 0,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1
                },
                onReady: function (playerInstance) {
                    console.log('vlitejs YouTube player is ready');
                }
            });
        });
    </script>
</body>
</html>
