<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-App Diagram Generator</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }

        .widget-container {
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h2 {
            margin: 0;
            font-size: 1.4rem;
            color: #1e293b;
        }

        .description {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: -10px;
        }

        .control-panel {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .alert-banner {
            text-align: center;
            color: #059669;
            font-weight: 500;
            font-size: 0.95rem;
            display: none;
            padding: 12px;
            background: #d1fae5;
            border-radius: 8px;
            border: 1px solid #10b981;
        }

        .iframe-wrapper {
            width: 100%;
            height: 600px;
            border: 2px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
        }

        /* The src points to the unblocked null.perchance.org subdomain */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 600px) {
            .control-panel {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <h2>In-App Diagram Engine</h2>
        <div class="description">Strict educational prompt generation natively embedded.</div>

        <div class="control-panel">
            <input type="text" id="topicInput" placeholder="Enter topic (e.g., Cellular Respiration)...">
            <button id="copyBtn">1. Prepare Prompt</button>
        </div>

        <div id="alertBanner" class="alert-banner">
            ✅ Strict educational prompt copied! Paste it into the embedded generator below.
        </div>

        <div class="iframe-wrapper">
            <!-- Using the null subdomain bypasses the X-Frame-Options connection refusal -->
            <iframe src="https://null.perchance.org/ai-text-to-image-generator" allow="fullscreen"></iframe>
        </div>
    </div>

    <script>
        const input = document.getElementById('topicInput');
        const btn = document.getElementById('copyBtn');
        const alertBanner = document.getElementById('alertBanner');

        btn.addEventListener('click', async () => {
            const topic = input.value.trim();
            if (!topic) return;

            const engineeredPrompt = `highly accurate educational scientific textbook diagram of ${topic}, clean white background, vector graphic schematic style, clear English text labels with pointing arrows, no background clutter, academic, instructional`;

            try {
                await navigator.clipboard.writeText(engineeredPrompt);
                
                alertBanner.style.display = 'block';
                btn.textContent = 'Copied!';
                btn.style.background = '#10b981';
                
                setTimeout(() => {
                    alertBanner.style.display = 'none';
                    btn.textContent = '1. Prepare Prompt';
                    btn.style.background = 'var(--primary)';
                }, 5000);
            } catch (err) {
                // Failsafe for strict browser isolation
                prompt("Please copy your strict educational prompt below:", engineeredPrompt);
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
