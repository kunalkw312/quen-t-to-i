<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen-Image Generator (NVIDIA NIM)</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #76b900; /* NVIDIA Green */
            --primary-hover: #5a8e00;
            --border-color: #cccccc;
            --error-color: #d9534f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .result-area {
            margin-top: 25px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 15px;
            background-color: #fafafa;
        }

        .result-area img {
            max-width: 100%;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none; /* Hidden by default */
        }

        .status-text {
            color: #666;
            font-size: 0.95rem;
        }

        .error {
            color: var(--error-color);
            font-weight: bold;
            margin-top: 10px;
            word-wrap: break-word;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none; /* Hidden by default */
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hint {
            font-size: 0.8rem;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NVIDIA NIM Image Generator</h1>
        
        <div class="form-group">
            <label for="apiKey">NVIDIA NIM API Key</label>
            <input type="password" id="apiKey" placeholder="nvapi-..." required>
        </div>

        <div class="form-group">
            <label for="prompt">Image Prompt</label>
            <textarea id="prompt" placeholder="A futuristic city with flying cars at sunset, digital art..." required></textarea>
        </div>

        <button id="generateBtn">Generate Image</button>

        <div class="result-area" id="resultArea">
            <div class="loader" id="loader"></div>
            <div class="status-text" id="statusText">Your image will appear here</div>
            <img id="generatedImage" alt="Generated Output">
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const promptInput = document.getElementById('prompt');
        const resultArea = document.getElementById('resultArea');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');
        const generatedImage = document.getElementById('generatedImage');

        generateBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const prompt = promptInput.value.trim();

            // Basic validation
            if (!apiKey) {
                showError("Please enter your NVIDIA API key.");
                return;
            }
            if (!prompt) {
                showError("Please enter a prompt.");
                return;
            }

            // Reset UI for loading state
            resetUI();
            generateBtn.disabled = true;
            loader.style.display = 'block';
            statusText.textContent = "Generating image... this may take a few seconds.";

            try {
                // NVIDIA NIM OpenAI-Compatible Image Generation API endpoint
                const response = await fetch('https://integrate.api.nvidia.com/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "qwen-image",
                        prompt: prompt,
                        response_format: "url" // Request URL format (fallback logic built-in for b64)
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || data.error?.message || `HTTP Error: ${response.status}`);
                }

                if (data && data.data && data.data.length > 0) {
                    // Handle both URL and Base64 JSON responses depending on endpoint strictness
                    let imageSrc = "";
                    if (data.data[0].url) {
                        imageSrc = data.data[0].url;
                    } else if (data.data[0].b64_json) {
                        imageSrc = "data:image/jpeg;base64," + data.data[0].b64_json;
                    } else {
                        throw new Error("No image data found in the response payload.");
                    }

                    displayImage(imageSrc);
                } else {
                    throw new Error("Unexpected API response format.");
                }

            } catch (error) {
                console.error("API Error:", error);
                showError(error.message);
            } finally {
                generateBtn.disabled = false;
                loader.style.display = 'none';
            }
        });

        function resetUI() {
            generatedImage.style.display = 'none';
            generatedImage.src = "";
            statusText.textContent = "";
            statusText.className = "status-text";
        }

        function displayImage(src) {
            generatedImage.src = src;
            generatedImage.style.display = 'block';
            statusText.style.display = 'none';
        }

        function showError(message) {
            statusText.textContent = message;
            statusText.className = "status-text error";
            statusText.style.display = 'block';
            generatedImage.style.display = 'none';
            loader.style.display = 'none';
        }
    </script>
</body>
</html>
