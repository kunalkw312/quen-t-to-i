<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Diagram Generator</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 1.75rem;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #64748b;
            margin-top: -12px;
            line-height: 1.5;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1.05rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .status {
            text-align: center;
            color: #059669;
            font-weight: 500;
            font-size: 0.95rem;
            display: none;
            padding: 15px;
            background: #d1fae5;
            border-radius: 8px;
            border: 1px solid #10b981;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Educational Diagram Engine</h1>
        <div class="subtitle">Generates a strict academic prompt and securely opens the rendering engine in a new tab.</div>

        <div class="search-box">
            <input type="text" id="topicInput" placeholder="Enter topic (e.g., Plant Cell, Tectonic Plates)...">
            <button id="actionBtn">Generate & Open Perchance</button>
        </div>

        <div id="status" class="status">
            ✅ Strict educational prompt copied to your clipboard!<br><br>
            A new tab has opened. Simply paste the prompt into the Perchance text box and click Generate.
        </div>
    </div>

    <script>
        const input = document.getElementById('topicInput');
        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            const topic = input.value.trim();
            if (!topic) return;

            // Strict textbook styling prompt
            const engineeredPrompt = `highly accurate educational scientific textbook diagram of ${topic}, clean white background, vector graphic schematic style, clear English text labels with pointing arrows, no background clutter, academic, instructional`;

            try {
                // Copy the prompt to the clipboard
                await navigator.clipboard.writeText(engineeredPrompt);
                
                // Show success message
                status.style.display = 'block';
                btn.textContent = 'Copied! Opening tab...';
                btn.style.background = '#10b981';
                
                // Open Perchance in a new tab
                setTimeout(() => {
                    window.open('https://perchance.org/ai-text-to-image-generator', '_blank');
                    
                    // Reset UI after opening
                    setTimeout(() => {
                        status.style.display = 'none';
                        btn.textContent = 'Generate & Open Perchance';
                        btn.style.background = 'var(--primary)';
                    }, 4000);
                }, 800);

            } catch (err) {
                // Fallback for strict browser privacy settings
                const fallbackPrompt = prompt("Clipboard auto-copy was blocked by your browser. Please copy the prompt below manually, then click OK to open the generator:", engineeredPrompt);
                if (fallbackPrompt !== null) {
                    window.open('https://perchance.org/ai-text-to-image-generator', '_blank');
                }
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
