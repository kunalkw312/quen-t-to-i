<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBoard Science & Math Integration</title>

  <!-- Google Fonts & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <!-- Sketchfab Viewer API -->
  <script type="text/javascript" src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>

  <style>
    /* Modern CSS Variables */
    :root {
      --bg-base: #0b0f19;
      --bg-surface: #1e293b;
      --bg-surface-hover: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-surface-hover); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* SmartBoard Header Toolbar */
    .toolbar {
      height: 64px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-right: 16px;
    }

    .btn {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--text-muted);
    }

    .btn.primary {
      background-color: var(--primary);
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn.primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    #active-sim-title {
      font-weight: 500;
      background: #1e293b;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    /* Main Container */
    .container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Side Panel */
    .side-panel {
      width: 380px;
      background-color: #0f172a;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      box-shadow: var(--shadow-lg);
    }

    .side-panel.closed {
      transform: translateX(-100%);
      position: absolute;
      height: 100%;
    }

    /* Tabs (Segmented Control Style) */
    .tabs {
      display: flex;
      padding: 16px;
      gap: 4px;
      background-color: #0f172a;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      background-color: transparent;
      color: var(--text-muted);
      border: none;
      padding: 10px 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 8px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tab-btn .material-symbols-outlined {
      font-size: 1.4rem;
    }

    .tab-btn:hover {
      background-color: var(--bg-surface);
      color: var(--text-main);
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: white;
      box-shadow: var(--shadow-md);
    }

    /* Search Box */
    .search-box {
      padding: 16px;
      display: flex;
      gap: 8px;
      background-color: #0f172a;
      border-bottom: 1px solid var(--border);
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input-wrapper .material-symbols-outlined {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .search-box input {
      width: 100%;
      padding: 10px 10px 10px 36px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    /* Simulation Tree (Accordion) */
    .sim-tree {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .subject-header {
      padding: 14px 16px;
      background-color: var(--bg-surface);
      margin-top: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .subject-header:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border);
    }

    .sim-item {
      padding: 10px 16px 10px 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      position: relative;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sim-item::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      background-color: var(--text-muted);
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .sim-item:hover {
      background-color: rgba(99, 102, 241, 0.1);
      color: var(--text-main);
    }

    .sim-item:hover::before {
      background-color: var(--primary);
    }

    /* 3D Models Grid Layout */
    .sketchfab-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding-bottom: 20px;
    }

    .sketchfab-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .sketchfab-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .sketchfab-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      background-color: #000;
      border-bottom: 1px solid var(--border);
    }

    .sketchfab-card h4 {
      font-size: 0.8rem;
      padding: 10px;
      margin: 0;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    /* Content / SmartBoard Area */
    .board-area {
      flex: 1;
      background-image: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .whiteboard-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
      gap: 16px;
    }

    .whiteboard-placeholder .material-symbols-outlined {
      font-size: 4rem;
      color: var(--bg-surface-hover);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top SmartBoard Controls -->
  <div class="toolbar">
    <div class="brand">
      <span class="material-symbols-outlined">cast_for_education</span>
      OpenX
    </div>
    <button class="btn" onclick="toggleSidebar()" title="Toggle Sidebar">
      <span class="material-symbols-outlined">menu_open</span>
    </button>
    
    <span id="active-sim-title">
      <span class="material-symbols-outlined" style="font-size: 1.2rem;">info</span>
      <span id="title-text">No resource loaded</span>
    </span>

    <div class="model-controls">
      <!-- Fullscreen Button -->
      <button class="btn hidden" id="fullscreenBtn" onclick="toggleFullScreen()" title="Full Screen">
        <span class="material-symbols-outlined">fullscreen</span> Full Screen
      </button>

      <!-- Dynamic Animation Controls for 3D Viewer -->
      <div id="sketchfabControls" class="hidden" style="display:flex; gap:10px;">
        <button class="btn primary" onclick="playAnimation()">
          <span class="material-symbols-outlined">play_arrow</span> Play
        </button>
        <button class="btn" onclick="pauseAnimation()">
          <span class="material-symbols-outlined">pause</span> Pause
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Collapsible Side Panel -->
    <div class="side-panel" id="sidePanel">

      <!-- Toggle Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-3d" onclick="switchMode('3d')">
          <span class="material-symbols-outlined">view_in_ar</span>
          3D Models
        </button>
        <button class="tab-btn" id="tab-phet" onclick="switchMode('phet')">
          <span class="material-symbols-outlined">science</span>
          2D PhET
        </button>
        <button class="tab-btn" id="tab-videos" onclick="switchMode('videos')">
          <span class="material-symbols-outlined">smart_display</span>
          Videos
        </button>
        <button class="tab-btn" id="tab-ebooks" onclick="switchMode('ebooks')">
          <span class="material-symbols-outlined">menu_book</span>
          e-Books
        </button>
      </div>

      <div class="search-box">
        <div class="search-input-wrapper">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="searchInput" placeholder="Search 3D models (e.g. Heart)..." oninput="onSearchInput(event)" />
        </div>
        <button id="searchBtn" class="btn primary" onclick="performSketchfabSearch()" style="padding: 0 16px;">
          Search
        </button>
      </div>

      <div class="sim-tree" id="simTree">
        <!-- Dynamically injected via JavaScript -->
      </div>
    </div>

    <!-- Main SmartBoard Stage Area -->
    <div class="board-area" id="boardArea">
      <div id="whiteboardPlaceholder" class="whiteboard-placeholder">
        <span class="material-symbols-outlined">interactive_space</span>
        <h2>Ready to Explore</h2>
        <p>Select a 3D model, simulation, video, or e-book from the panel to project it onto the SmartBoard.</p>
      </div>
      <iframe id="phetIframe" class="hidden" allow="fullscreen; autoplay; xr-spatial-tracking" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // -----------------------------------------
    // 1. PhET (2D) Data
    // -----------------------------------------
    const phetData = {
      physics: {
        title: "Physics",
        chapters: {
          "Motion": [
            { name: "Buoyancy: Basics", url: "https://phet.colorado.edu/sims/html/buoyancy-basics/latest/buoyancy-basics_en.html" },
            { name: "Buoyancy", url: "https://phet.colorado.edu/sims/html/buoyancy/latest/buoyancy_en.html" },
            { name: "Projectile Data Lab", url: "https://phet.colorado.edu/sims/html/projectile-data-lab/latest/projectile-data-lab_en.html" },
            { name: "Kepler's Laws", url: "https://phet.colorado.edu/sims/html/keplers-laws/latest/keplers-laws_en.html" }
          ]
        }
      },
      biology: {
        title: "Biology",
        chapters: {
          "General Biology": [
            { name: "Membrane Transport", url: "https://phet.colorado.edu/sims/html/membrane-transport/latest/membrane-transport_en.html" },
            { name: "Density", url: "https://phet.colorado.edu/sims/html/density/latest/density_en.html" }
          ]
        }
      },
      chemistry: {
        title: "Chemistry",
        chapters: {
          "General Chemistry": [
            { name: "Membrane Transport", url: "https://phet.colorado.edu/sims/html/membrane-transport/latest/membrane-transport_en.html" },
            { name: "Models of the Hydrogen Atom", url: "https://phet.colorado.edu/sims/html/models-of-the-hydrogen-atom/latest/models-of-the-hydrogen-atom_en.html" }
          ]
        }
      },
      math: {
        title: "Math & Statistics",
        chapters: {
          "Math Concepts": [
            { name: "Number Pairs", url: "https://phet.colorado.edu/sims/html/number-pairs/latest/number-pairs_en.html" },
            { name: "Mean: Share and Balance", url: "https://phet.colorado.edu/sims/html/mean-share-and-balance/latest/mean-share-and-balance_en.html" }
          ]
        }
      }
    };

    // -----------------------------------------
    // 2. Free Video Content Data
    // -----------------------------------------
    const videoData = {
      biology: {
        title: "Biology",
        chapters: {
          "Free Video Content": [
            { name: "CELL: The Building Block of Life", url: "https://www.youtube.com/embed/IkYy7SFXOpg" },
            { name: "Tissues", url: "https://www.youtube.com/embed/fD6eqAlUxY8" }
          ]
        }
      },
      physics: {
        title: "Physics",
        chapters: {
          "Free Video Content": [
            { name: "Current Electricity", url: "https://www.youtube.com/embed/AlDeY2m3RPM" },
            { name: "Refraction of Light", url: "https://www.youtube.com/embed/6qdkpXoqugw" }
          ]
        }
      }
    };

    // -----------------------------------------
    // 3. e-Book Library Data (Static Roots)
    // -----------------------------------------
    const eBooksData = {
      maharashtra: {
        title: "Maharashtra State Board",
        chapters: {
          "Classes 1 to 12": [
            { name: "Balbharati Books ↗", url: "https://books.ebalbharati.in/ebook.aspx", external: true }
          ]
        }
      }
      // Dynamic Cloudinary Root Folders (like NCERT BOOKS) will automatically inject here
    };

    let currentMode = '3d'; // Default active tab is '3d'
    let viewerAPI = null;   // Sketchfab Viewer API instance

    function switchMode(mode) {
      currentMode = mode;

      // Update UI Tabs
      document.getElementById('tab-3d').classList.toggle('active', mode === '3d');
      document.getElementById('tab-phet').classList.toggle('active', mode === 'phet');
      document.getElementById('tab-videos').classList.toggle('active', mode === 'videos');
      document.getElementById('tab-ebooks').classList.toggle('active', mode === 'ebooks');

      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');

      searchInput.value = "";

      if (mode === '3d') {
        searchInput.placeholder = "Search 3D models (e.g. Heart)...";
        searchBtn.classList.remove('hidden');
        const container = document.getElementById("simTree");
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.9rem;">Type a query like <i>Human heart</i>, <i>Brain</i>, or <i>Skeleton</i> and press Search.</p>';
      } else {
        searchInput.placeholder = "Search resources...";
        searchBtn.classList.add('hidden');
        renderTree();
      }
    }

    function onSearchInput(event) {
      if (currentMode === '3d') {
        if (event.key === 'Enter') performSketchfabSearch();
      } else {
        filterSimulations();
      }
    }

    document.getElementById('searchInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && currentMode === '3d') performSketchfabSearch();
    });

    // -----------------------------------------
    // 4. Recursive Tree Renderer
    // -----------------------------------------
    function renderTree() {
      const container = document.getElementById("simTree");
      container.innerHTML = "";

      let activeData;
      if (currentMode === 'phet') activeData = phetData;
      else if (currentMode === 'videos') activeData = videoData;
      else if (currentMode === 'ebooks') activeData = eBooksData;
      else return;

      for (const [key, category] of Object.entries(activeData)) {
        // Main Header (e.g. "Physics", "NCERT BOOKS")
        const catHeader = document.createElement("div");
        catHeader.className = "subject-header";
        catHeader.innerHTML = `<span>${category.title || key}</span> <span class="material-symbols-outlined">expand_more</span>`;

        const catContent = document.createElement("div");
        catContent.classList.add("hidden");
        catContent.style.paddingLeft = "8px"; // indent

        // Handle flat legacy chapters (PhET / Videos / Static Books)
        if (category.chapters) {
          for (const [chapName, sims] of Object.entries(category.chapters)) {
            const chapHeader = document.createElement("div");
            chapHeader.className = "subject-header";
            chapHeader.style.backgroundColor = "transparent";
            chapHeader.style.borderLeft = "2px solid var(--border)";
            chapHeader.style.marginTop = "4px";
            chapHeader.innerHTML = `<span style="font-size:0.85rem; color:var(--primary); font-weight:700; text-transform:uppercase;">${chapName}</span> <span class="material-symbols-outlined" style="font-size:1.2rem;">expand_more</span>`;

            const chapContent = document.createElement("div");
            chapContent.classList.add("hidden");

            if (sims.length === 0) {
              chapContent.innerHTML = `<div class="sim-item" style="opacity:0.6; cursor:default;">Coming Soon...</div>`;
            } else {
              sims.forEach(sim => {
                const simEl = document.createElement("div");
                simEl.className = "sim-item";
                simEl.innerText = sim.name;
                simEl.onclick = () => loadSimulation(sim.name, sim.url, sim.external);
                chapContent.appendChild(simEl);
              });
            }

            chapHeader.onclick = (e) => {
              e.stopPropagation();
              chapContent.classList.toggle("hidden");
              chapHeader.querySelector('.material-symbols-outlined').innerText = chapContent.classList.contains("hidden") ? "expand_more" : "expand_less";
            };

            catContent.appendChild(chapHeader);
            catContent.appendChild(chapContent);
          }
        }

        // Handle Deeply Nested Folders (Cloudinary E-Books)
        if (category.folders) {
          buildRecursiveFolders(category.folders, catContent);
        }

        catHeader.onclick = () => {
          catContent.classList.toggle("hidden");
          catHeader.querySelector('.material-symbols-outlined').innerText = catContent.classList.contains("hidden") ? "expand_more" : "expand_less";
        };

        container.appendChild(catHeader);
        container.appendChild(catContent);
      }
    }

    function buildRecursiveFolders(folderObj, parentContainer) {
      // Sort keys alphabetically so folders appear in order
      const sortedKeys = Object.keys(folderObj).sort();

      sortedKeys.forEach(folderName => {
        const contents = folderObj[folderName];

        if (folderName === "_files") {
          // Render files in this level
          contents.forEach(file => {
            const fileEl = document.createElement("div");
            fileEl.className = "sim-item";
            fileEl.innerHTML = `<span class="material-symbols-outlined" style="font-size: 1.1rem; color: #ef4444; margin-right: 4px;">picture_as_pdf</span> ${file.name}`;
            fileEl.onclick = () => loadSimulation(file.name, file.url, file.external);
            parentContainer.appendChild(fileEl);
          });
        } else {
          // Render a sub-folder
          const folderHeader = document.createElement("div");
          folderHeader.className = "subject-header";
          folderHeader.style.backgroundColor = "transparent";
          folderHeader.style.borderLeft = "2px solid var(--border)";
          folderHeader.style.marginTop = "4px";
          folderHeader.innerHTML = `<span style="font-size:0.85rem; color:var(--text-main); font-weight:600;"><span class="material-symbols-outlined" style="font-size:1.1rem; vertical-align:text-bottom; margin-right:6px; color:var(--secondary)">folder</span>${folderName}</span> <span class="material-symbols-outlined" style="font-size:1.2rem;">expand_more</span>`;

          const folderContent = document.createElement("div");
          folderContent.classList.add("hidden");
          folderContent.style.paddingLeft = "12px";

          buildRecursiveFolders(contents, folderContent);

          folderHeader.onclick = (e) => {
            e.stopPropagation();
            folderContent.classList.toggle("hidden");
            folderHeader.querySelector('.material-symbols-outlined:last-child').innerText = folderContent.classList.contains("hidden") ? "expand_more" : "expand_less";
          };

          parentContainer.appendChild(folderHeader);
          parentContainer.appendChild(folderContent);
        }
      });
    }

    // -----------------------------------------
    // 5. Cloudinary Automated E-Books Fetch
    // -----------------------------------------
    async function fetchBooksFromCloudinary() {
      const cloudName = 'jkhyxfzz';
      const tagName = 'books'; 
      const listUrl = `https://res.cloudinary.com/${cloudName}/image/list/${tagName}.json`;

      try {
        const noCacheUrl = listUrl + "?v=" + new Date().getTime();
        const response = await fetch(noCacheUrl);
        
        if (!response.ok) {
            console.warn("Cloudinary Books: Could not fetch list. Check if the 'books' tag is enabled on your PDFs.");
            return;
        }

        const data = await response.json();

        // Parse Cloudinary file paths dynamically into the tree
        data.resources.forEach(file => {
            const parts = file.public_id.split('/');
            
            // 1. Isolate the actual file name
            const fileName = parts.pop(); 

            // 2. The very first folder (e.g. "NCERT BOOKS") becomes a top-level root category
            const rootFolderName = parts.length > 0 ? parts.shift() : "Uncategorized Books";
            const rootKey = "cloud_" + rootFolderName.replace(/\s+/g, '_').toLowerCase();

            // 3. Create the root category if it doesn't exist in our eBooksData yet
            if (!eBooksData[rootKey]) {
                eBooksData[rootKey] = {
                    title: rootFolderName,
                    folders: {}
                };
            }

            let currentLevel = eBooksData[rootKey].folders;
            
            // 4. Build the inner folder hierarchy dynamically (e.g., Class 10 > English > jhks1dd)
            parts.forEach(folderName => {
                if (!currentLevel[folderName]) {
                    currentLevel[folderName] = {};
                }
                currentLevel = currentLevel[folderName];
            });

            if (!currentLevel._files) {
                currentLevel._files = [];
            }

            let format = file.format || 'pdf';
            let rawPdfUrl = `https://res.cloudinary.com/${cloudName}/image/upload/v${file.version}/${file.public_id}.${format}`;
            
            // 5. WRAP IN GOOGLE DOCS VIEWER: This completely bypasses Cloudinary's "Open" button 
            // and forces the PDF to render fully inline inside the iframe.
            let pdfViewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(rawPdfUrl)}&embedded=true`;

            currentLevel._files.push({
                name: fileName, 
                url: pdfViewerUrl,
                external: false
            });
        });

        // If currently viewing the ebooks tab while it loaded, refresh the menu tree
        if (currentMode === 'ebooks') {
            renderTree();
        }

      } catch (error) {
        console.error('Error fetching Cloudinary Books:', error);
      }
    }

    // Execute the Cloudinary fetch immediately on load
    window.addEventListener('load', fetchBooksFromCloudinary);

    // -----------------------------------------
    // 6. Sketchfab 3D Models Integration
    // -----------------------------------------
    async function performSketchfabSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const container = document.getElementById("simTree");

      if (!query) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.9rem;">Please enter a search term (e.g., <i>Human heart</i>, <i>Brain</i>, <i>DNA</i>).</p>';
        return;
      }

      container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;"><span class="material-symbols-outlined" style="animation: spin 2s linear infinite;">autorenew</span><br>Loading 3D models...</div>';

      try {
        const response = await fetch(`https://api.sketchfab.com/v3/search?type=models&q=${encodeURIComponent(query)}`);
        const data = await response.json();

        container.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">No 3D models found for "${query}".</p>`;
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'sketchfab-grid';

        data.results.forEach(model => {
          const thumbUrl = model.thumbnails?.images?.find(img => img.width >= 200)?.url || model.thumbnails?.images?.[0]?.url || '';

          const card = document.createElement('div');
          card.className = 'sketchfab-card';
          card.title = model.name;
          card.onclick = () => loadSketchfabModel(model.name, model.uid);

          card.innerHTML = `
            <img src="${thumbUrl}" alt="${model.name}" loading="lazy">
            <h4>${model.name}</h4>
          `;
          grid.appendChild(card);
        });

        container.appendChild(grid);
      } catch (error) {
        console.error('Error fetching 3D models:', error);
        container.innerHTML = '<p style="text-align: center; color: #f87171; padding: 20px;">Failed to load models.</p>';
      }
    }

    function loadSketchfabModel(name, uid) {
      const iframe = document.getElementById("phetIframe");
      const placeholder = document.getElementById("whiteboardPlaceholder");
      const titleSpan = document.getElementById("active-sim-title");
      const titleText = document.getElementById("title-text");
      const modelControls = document.getElementById("sketchfabControls");
      const fullscreenBtn = document.getElementById("fullscreenBtn");

      placeholder.classList.add("hidden");
      iframe.classList.remove("hidden");
      
      titleSpan.querySelector('.material-symbols-outlined').innerText = 'view_in_ar';
      titleSpan.querySelector('.material-symbols-outlined').style.color = 'var(--primary)';
      titleText.innerText = name;
      
      modelControls.style.display = "flex";
      fullscreenBtn.classList.remove("hidden");

      // Initialize Sketchfab Viewer API
      viewerAPI = null;
      const client = new Sketchfab('1.12.1', iframe);
      client.init(uid, {
        autostart: 1,
        ui_theme: 'dark',
        success: function onSuccess(api) {
          viewerAPI = api;
          api.start();
        },
        error: function onError() {
          console.error('Sketchfab API Error');
        }
      });
    }

    function playAnimation() { if (viewerAPI) viewerAPI.play(); }
    function pauseAnimation() { if (viewerAPI) viewerAPI.pause(); }

    // -----------------------------------------
    // General Functions
    // -----------------------------------------
    function toggleSidebar() {
      document.getElementById("sidePanel").classList.toggle("closed");
    }

    function loadSimulation(name, url, external = false) {
      if (external) {
        window.open(url, '_blank');
        return;
      }

      // Hide Sketchfab controls if switching away from 3D models
      document.getElementById("sketchfabControls").style.display = "none";
      document.getElementById("fullscreenBtn").classList.remove("hidden");
      viewerAPI = null;

      const iframe = document.getElementById("phetIframe");
      const placeholder = document.getElementById("whiteboardPlaceholder");
      const titleSpan = document.getElementById("active-sim-title");
      const titleText = document.getElementById("title-text");

      iframe.src = url;
      iframe.classList.remove("hidden");
      placeholder.classList.add("hidden");
      
      let icon = "science";
      if(currentMode === "videos") icon = "smart_display";
      if(currentMode === "ebooks") icon = "menu_book";
      
      titleSpan.querySelector('.material-symbols-outlined').innerText = icon;
      titleSpan.querySelector('.material-symbols-outlined').style.color = 'var(--primary)';
      titleText.innerText = name;
    }

    function toggleFullScreen() {
      const board = document.getElementById('boardArea');
      if (!document.fullscreenElement) {
        board.requestFullscreen().catch(err => {
          console.warn(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    function filterSimulations() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const items = document.querySelectorAll(".sim-item");

      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        if (text.includes(query)) {
          item.classList.remove("hidden");
        } else {
          item.classList.add("hidden");
        }
      });
    }

    // Initial setup on 3D Models tab
    const initialTree = document.getElementById("simTree");
    initialTree.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.9rem;">Type a query like <i>Human heart</i>, <i>Brain</i>, or <i>Skeleton</i> and press Search.</p>';
  </script>
</body>
