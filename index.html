<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Junta - Local Test Sandbox</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // Custom Tailwind config to match your LMS theme
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandOrange: '#f7941d',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --input-bg: #11162a;
            --border-color: #354064;
            --text-main: #f8f9ff;
        }
        body {
            background-color: #080b18;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #354064; border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center h-screen p-4">

    <!-- MAIN CHAT CONTAINER -->
    <div class="w-full max-w-2xl bg-[#0c1022] border border-[var(--border-color)] rounded-2xl flex flex-col h-[90vh] shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-brandOrange/10 border-b border-brandOrange/20 p-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-brandOrange flex items-center justify-center text-white text-xl">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div>
                <h2 class="font-black italic text-brandOrange text-lg leading-tight">AI Junta</h2>
                <p class="text-[10px] uppercase tracking-widest opacity-60 font-bold"><i class="fa-solid fa-circle text-green-500 mr-1 animate-pulse"></i> connected to VPS</p>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div id="ai-messages" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
            <div class="bg-[var(--input-bg)] border border-[var(--border-color)] p-3 rounded-2xl rounded-tl-sm max-w-[85%] fade-in">
                <p class="text-sm">Hello! I am AI Junta, streaming live from your Hostinger VPS. My voice is powered by VoiceStudio. How can I help you today?</p>
            </div>
        </div>

        <!-- Visualizer Area -->
        <div class="px-4">
            <div id="ai-voice-visualizer-container" class="hidden w-full h-12 bg-black rounded-xl flex items-center justify-center border border-brandOrange/30 shadow-[0_0_15px_rgba(247,148,29,0.2)]">
                <canvas id="ai-voice-canvas" class="w-full h-full rounded-xl"></canvas>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-[#080b18] border-t border-[var(--border-color)]">
            <div class="flex items-center gap-2">
                
                <!-- File Input (Hidden) & Label -->
                <input type="file" id="ai-media-file" class="hidden" accept="image/*, .pdf, .doc, .docx, .txt">
                <label for="ai-media-file" class="w-10 h-10 shrink-0 rounded-xl bg-[var(--input-bg)] text-[var(--text-main)] border border-[var(--border-color)] flex items-center justify-center hover:bg-brandOrange hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-paperclip"></i>
                </label>

                <!-- Mute TTS -->
                <button id="ai-tts-toggle-btn" onclick="toggleAITTS()" class="w-10 h-10 shrink-0 rounded-xl bg-[var(--input-bg)] text-[var(--text-main)] border border-[var(--border-color)] flex items-center justify-center hover:bg-brandOrange hover:text-white transition shadow-sm" title="Mute AI Voice">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <!-- Text Input -->
                <input type="text" id="ai-input" placeholder="Ask AI Junta anything..." 
                       class="flex-1 h-10 bg-black border border-[var(--border-color)] rounded-xl px-4 text-sm outline-none focus:border-brandOrange transition-colors"
                       onkeydown="if(event.key==='Enter') sendAIMessage()">

                <!-- Voice / STT Buttons -->
                <button id="ai-mic-btn" onclick="startAIVoice()" class="w-10 h-10 shrink-0 rounded-xl bg-brandOrange/10 text-brandOrange border border-brandOrange/20 flex items-center justify-center hover:bg-brandOrange hover:text-white transition shadow-sm" title="Start Dictation">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button id="ai-stop-btn" onclick="stopAIVoice()" class="hidden w-10 h-10 shrink-0 rounded-xl bg-red-500/10 text-red-500 border border-red-500/20 flex items-center justify-center hover:bg-red-500 hover:text-white transition shadow-sm" title="Stop Dictation">
                    <i class="fa-solid fa-square text-xs animate-pulse"></i>
                </button>

                <!-- Send Button -->
                <button onclick="sendAIMessage()" class="w-10 h-10 shrink-0 rounded-xl bg-brandOrange text-white flex items-center justify-center hover:bg-[#e0861a] transition shadow-lg">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>
            <!-- File Preview Area -->
            <div id="ai-file-preview" class="hidden text-[10px] text-brandOrange mt-2 font-bold"><i class="fa-solid fa-file mr-1"></i> File attached</div>
        </div>
    </div>


    <!-- JAVASCRIPT LOGIC -->
    <script>
        // MOCK CONFIGURATION FOR STANDALONE TEST
        const customAiConfig = { apiUrl: 'https://openclase.com/api/ai-junta' };
        window.profile = { name: "Test Developer", role: "super_admin", instituteId: "INST-TEST" };
        window.currentNavTab = "test_sandbox";
        window.toast = (msg) => console.log("TOAST:", msg); // Simple console log for errors

        // File upload UI logic
        document.getElementById('ai-media-file').addEventListener('change', function(e) {
            const preview = document.getElementById('ai-file-preview');
            if(this.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-file mr-1"></i> ${this.files[0].name}`;
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
            }
        });

        // ============================================================
        // AI CHAT & VOICESTUDIO PIPELINE
        // ============================================================
        window._aiVoiceSocket = null;
        window._aiMediaRecorder = null;
        window._aiAudioContext = null;
        window._aiAnalyser = null;
        window._aiVoiceQueue = [];
        window._aiIsPlaying = false;
        window._aiTtsMuted = false;
        window._activeAIAudioSource = null;
        window._aiChatHistory = [];

        async function playNextAIAudio() {
            if (window._aiTtsMuted || window._aiIsPlaying || window._aiVoiceQueue.length === 0) return;
            window._aiIsPlaying = true;
            
            try {
                const audioData = window._aiVoiceQueue.shift();
                if (!window._aiAudioContext) {
                    window._aiAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (window._aiAudioContext.state === 'suspended') await window._aiAudioContext.resume();
                
                const audioBuffer = await window._aiAudioContext.decodeAudioData(audioData);
                window._activeAIAudioSource = window._aiAudioContext.createBufferSource();
                window._activeAIAudioSource.buffer = audioBuffer;
                window._activeAIAudioSource.connect(window._aiAudioContext.destination);
                
                window._activeAIAudioSource.onended = () => {
                    window._aiIsPlaying = false;
                    playNextAIAudio(); 
                };
                window._activeAIAudioSource.start(0);
            } catch(e) {
                window._aiIsPlaying = false;
                playNextAIAudio();
            }
        }

        async function sendAIMessage() {
            const input = document.getElementById('ai-input');
            const fileInput = document.getElementById('ai-media-file');
            const preview = document.getElementById('ai-file-preview');

            const text = input.value.trim();
            const file = fileInput?.files[0];
            if (!text && !file) return;

            if (window._aiSpeechRec) stopAIVoice();
            stopAITTS();

            const messagesDiv = document.getElementById('ai-messages');

            messagesDiv.innerHTML += `
                <div class="bg-brandOrange/20 text-white p-3 rounded-2xl rounded-tr-sm max-w-[85%] ml-auto mb-2 fade-in">
                    ${file ? `<p class="text-[10px] text-brandOrange font-bold mb-1"><i class="fa-solid fa-paperclip mr-1"></i>${file.name}</p>` : ''}
                    <p class="text-sm">${text || 'Analyze attached file'}</p>
                </div>`;
            
            window._aiChatHistory.push({ role: 'user', content: text || 'Analyzed an uploaded file/image.' });
            
            input.value = '';
            if (fileInput) fileInput.value = '';
            if (preview) { preview.innerText = ''; preview.classList.add('hidden'); }

            const streamId = 'ai-stream-' + Date.now();
            messagesDiv.innerHTML += `
                <div class="bg-[var(--input-bg)] border border-[var(--border-color)] p-3 rounded-2xl rounded-tl-sm max-w-[85%] mb-2 fade-in">
                    <div id="${streamId}" class="text-sm leading-relaxed"><span class="text-xs opacity-50"><i class="fa-solid fa-spinner fa-spin"></i> Thinking...</span></div>
                </div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const formData = new FormData();
                formData.append('message', text);
                formData.append('user', window.profile?.name || '');
                formData.append('role', window.profile?.role || 'student');
                formData.append('history', JSON.stringify(window._aiChatHistory)); 
                if (file) formData.append('file', file);

                const response = await fetch(customAiConfig.apiUrl, { method: 'POST', body: formData });
                if (!response.ok) throw new Error('AI request failed');

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                
                let fullText = "";
                let buffer = "";
                let sentenceBuffer = "";
                const targetDiv = document.getElementById(streamId);
                targetDiv.innerHTML = ""; 

                if (!window._aiVoiceSocket || window._aiVoiceSocket.readyState !== WebSocket.OPEN) {
                    // Hardcoded securely to your VPS
                    window._aiVoiceSocket = new WebSocket(`wss://openclase.com/ai-voice`);
                    window._aiVoiceSocket.binaryType = 'arraybuffer';
                    window._aiVoiceSocket.onmessage = async (e) => {
                        if (e.data instanceof ArrayBuffer && !window._aiTtsMuted) {
                            window._aiVoiceQueue.push(e.data);
                            playNextAIAudio();
                        }
                    };
                }

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    let boundary = buffer.indexOf('\n');
                    
                    while (boundary !== -1) {
                        let line = buffer.slice(0, boundary).trim();
                        buffer = buffer.slice(boundary + 1);
                        boundary = buffer.indexOf('\n');

                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const parsed = JSON.parse(line.slice(6));
                                const token = parsed.choices[0]?.delta?.content || '';
                                if (token) {
                                    fullText += token;
                                    targetDiv.innerHTML = fullText.replace(/\n/g, '<br>');
                                    messagesDiv.scrollTop = messagesDiv.scrollHeight;

                                    if (!window._aiTtsMuted) {
                                        sentenceBuffer += token;
                                        if (/[.!?]\s/.test(token) || /[.!?]\n/.test(token)) {
                                            if (window._aiVoiceSocket.readyState === WebSocket.OPEN) {
                                                window._aiVoiceSocket.send(JSON.stringify({ action: 'synthesize_text', text: sentenceBuffer }));
                                            }
                                            sentenceBuffer = "";
                                        }
                                    }
                                }
                            } catch (e) {}
                        }
                    }
                }
                targetDiv.removeAttribute('id');
                window._aiChatHistory.push({ role: 'assistant', content: fullText });
                
                if (!window._aiTtsMuted && sentenceBuffer.trim() && window._aiVoiceSocket && window._aiVoiceSocket.readyState === WebSocket.OPEN) {
                    window._aiVoiceSocket.send(JSON.stringify({ action: 'synthesize_text', text: sentenceBuffer }));
                }
            } catch (e) {
                document.getElementById(streamId).innerHTML = `<span class="text-red-500">Error: ${e.message}</span>`;
            }
        }

        function stopAITTS() {
            window._aiVoiceQueue = [];
            if (window._activeAIAudioSource) {
                try { window._activeAIAudioSource.stop(); } catch(e) {}
                window._activeAIAudioSource = null;
            }
            window._aiIsPlaying = false;
        }

        function toggleAITTS() {
            window._aiTtsMuted = !window._aiTtsMuted;
            const btn = document.getElementById('ai-tts-toggle-btn');
            if (window._aiTtsMuted) {
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                btn.classList.add('text-red-500');
                stopAITTS();
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                btn.classList.remove('text-red-500');
            }
        }

        async function startAIVoice() {
            stopAITTS();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                window._aiAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                window._aiAnalyser = window._aiAudioContext.createAnalyser();
                const source = window._aiAudioContext.createMediaStreamSource(stream);
                source.connect(window._aiAnalyser);
                window._aiAnalyser.connect(window._aiAudioContext.destination);
                
                document.getElementById('ai-voice-visualizer-container').classList.remove('hidden');
                drawVoiceVisualizer();

                document.getElementById('ai-mic-btn').classList.add('hidden');
                document.getElementById('ai-stop-btn').classList.remove('hidden');

                // Hardcoded securely to your VPS
                window._aiVoiceSocket = new WebSocket(`wss://openclase.com/ai-voice`);
                window._aiVoiceSocket.binaryType = 'arraybuffer';
                
                window._aiVoiceSocket.onopen = () => {
                    window._aiMediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    window._aiMediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0 && window._aiVoiceSocket.readyState === WebSocket.OPEN) {
                            window._aiVoiceSocket.send(e.data);
                        }
                    };
                    window._aiMediaRecorder.start(250); 
                };

                window._aiVoiceSocket.onmessage = async (e) => {
                    if (e.data instanceof ArrayBuffer) {
                        if (window._aiTtsMuted) return; 
                        window._aiVoiceQueue.push(e.data);
                        playNextAIAudio();
                    } else {
                        const msg = JSON.parse(e.data);
                        if (msg.type === 'transcript') {
                            document.getElementById('ai-input').value = msg.text;
                            sendAIMessage(); 
                        }
                    }
                };
            } catch (e) {
                console.error("Mic access error", e);
                alert("Microphone access denied or error occurred.");
            }
        }

        function stopAIVoice() {
            if (window._aiMediaRecorder && window._aiMediaRecorder.state !== 'inactive') {
                window._aiMediaRecorder.stop();
                if (window._aiVoiceSocket && window._aiVoiceSocket.readyState === WebSocket.OPEN) {
                    window._aiVoiceSocket.send(JSON.stringify({ action: 'process_audio' }));
                }
            }
            
            const canvas = document.getElementById('ai-voice-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            
            document.getElementById('ai-voice-visualizer-container')?.classList.add('hidden');
            document.getElementById('ai-mic-btn')?.classList.remove('hidden');
            document.getElementById('ai-stop-btn')?.classList.add('hidden');
        }

        function drawVoiceVisualizer() {
            const canvas = document.getElementById('ai-voice-canvas');
            if (!canvas || !window._aiAudioContext) return;
            const ctx = canvas.getContext('2d');
            
            const bufferLength = window._aiAnalyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                if (!window._aiAudioContext) return;
                requestAnimationFrame(draw);
                window._aiAnalyser.getByteFrequencyData(dataArray);
                
                ctx.fillStyle = 'rgb(0, 0, 0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;
                
                for(let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i] / 2;
                    ctx.fillStyle = 'rgb(247, 148, 29)'; 
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            draw();
        }
    </script>
</body>
</html>
