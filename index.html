<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Diagram Generator</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--surface);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 1.5rem;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-top: -12px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .status {
            text-align: center;
            color: #059669;
            font-weight: 500;
            font-size: 0.95rem;
            display: none;
            padding: 12px;
            background: #d1fae5;
            border-radius: 8px;
            border: 1px solid #10b981;
        }

        .iframe-container {
            width: 100%;
            height: 650px;
            border: 2px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Educational Diagram Engine</h1>
        <div class="subtitle">Strict Academic Formatting via Perchance</div>

        <div class="search-box">
            <input type="text" id="topicInput" placeholder="Enter topic (e.g., Plant Cell, Tectonic Plates)...">
            <button id="copyBtn">1. Generate & Copy Prompt</button>
        </div>

        <div id="status" class="status">
            ✅ Strict educational prompt copied! Click inside the text box below, paste the prompt, and click Generate.
        </div>

        <div class="iframe-container">
            <iframe src="https://perchance.org/ai-text-to-image-generator?embed=1" allow="fullscreen"></iframe>
        </div>
    </div>

    <script>
        const input = document.getElementById('topicInput');
        const btn = document.getElementById('copyBtn');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            const topic = input.value.trim();
            if (!topic) return;

            // Strict textbook styling prompt
            const engineeredPrompt = `highly accurate educational scientific textbook diagram of ${topic}, clean white background, vector graphic schematic style, clear English text labels with pointing arrows, no background clutter, academic, instructional`;

            try {
                // Since this will be hosted on GitHub Pages (HTTPS), the modern clipboard API will work perfectly without throwing security errors.
                await navigator.clipboard.writeText(engineeredPrompt);
                
                status.style.display = 'block';
                btn.textContent = 'Copied!';
                btn.style.background = '#10b981';
                
                setTimeout(() => {
                    status.style.display = 'none';
                    btn.textContent = '1. Generate & Copy Prompt';
                    btn.style.background = 'var(--primary)';
                }, 5000);
            } catch (err) {
                // Fallback just in case a user has strict browser privacy settings
                prompt("Clipboard access blocked. Copy the prompt below:", engineeredPrompt);
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
