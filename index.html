<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puter.js Educational Visuals</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 650px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 1.5rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .quick-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-btn {
            padding: 8px 10px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: #334155;
        }

        .quick-btn:hover {
            background: #e2e8f0;
            border-color: var(--primary);
            color: var(--primary);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.search-action {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button.search-action:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border);
            border-radius: 8px;
            background: #ffffff;
            padding: 15px;
        }

        .result img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 6px;
            background: white;
        }

        .diagram-title {
            margin-top: 12px;
            font-weight: 600;
.          color: #334155;
        }

        .status {
            color: #64748b;
            font-size: 0.95rem;
        }
    </style>

    <!-- Load Puter.js SDK via CDN -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>

    <div class="container">
        <h1>Puter.js Visual Generator</h1>
        <div class="subtitle">Zero API keys required. Uses Puter's user-auth cloud architecture.</div>

        <!-- Guaranteed Accurate Presets -->
        <div class="quick-select">
            <button class="quick-btn" onclick="loadPreset('Human Heart Anatomy', 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Heart_diagram-en.svg/800px-Heart_diagram-en.svg.png')">Human Heart</button>
            <button class="quick-btn" onclick="loadPreset('Plant Cell Structure', 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Plant_cell_structure-en.svg/800px-Plant_cell_structure-en.svg.png')">Plant Cell</button>
            <button class="quick-btn" onclick="loadPreset('Mature Flower Diagram', 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Mature_flower_diagram-en.svg/800px-Mature_flower_diagram-en.svg.png')">Hibiscus / Flower</button>
            <button class="quick-btn" onclick="loadPreset('Water Cycle Schematic', 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Water_cycle_blank.svg/800px-Water_cycle_blank.svg.png')">Water Cycle</button>
            <button class="quick-btn" onclick="loadPreset('Human Brain Anatomy', 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Brain_human_normal_inferior_view_with_labels_en.svg/800px-Brain_human_normal_inferior_view_with_labels_en.svg.png')">Human Brain</button>
            <button class="quick-btn" onclick="loadPreset('Neuron Structure', 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Neuron_Hand-made.svg/800px-Neuron_Hand-made.svg.png')">Neuron</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Or type custom prompt for AI generation...">
            <button class="search-action" id="searchBtn">Generate AI</button>
        </div>
        
        <div class="result" id="resultArea">
            <div id="status" class="status">Select a verified preset or type a prompt to generate via Puter AI.</div>
        </div>
    </div>

    <script>
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('searchBtn');
        const resultArea = document.getElementById('resultArea');

        function loadPreset(name, url) {
            resultArea.innerHTML = `
                <img src="${url}" alt="${name}">
                <div class="diagram-title">${name} (Verified Textbook Diagram)</div>
            `;
        }

        btn.addEventListener('click', async () => {
            const query = input.value.trim();
            if (!query) return;

            resultArea.innerHTML = `<div class="status">Generating via Puter AI... Please wait.</div>`;
            btn.disabled = true;

            try {
                // Enforce strict educational vector phrasing to prevent artistic hallucinations
                const engineeredPrompt = `A clean, highly accurate educational textbook diagram of ${query}, minimal vector illustration style, solid white background, correctly spelled English labels with indicator lines.`;

                // Call Puter.js text-to-image API (defaults or using FLUX/Stable Diffusion models via Puter)
                const imageElement = await puter.ai.txt2img(engineeredPrompt);

                resultArea.innerHTML = '';
                resultArea.appendChild(imageElement);
                
                const label = document.createElement('div');
                label.className = 'diagram-title';
                label.textContent = `Generated for: "${query}"`;
                resultArea.appendChild(label);

            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `<div class="status" style="color: #dc2626;">Error: Make sure you are signed into your Puter account when prompted.</div>`;
            } finally {
                btn.disabled = false;
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
