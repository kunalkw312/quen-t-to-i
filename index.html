<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana Pro Diagram Engine</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 650px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 1.5rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.search-action {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button.search-action:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border);
            border-radius: 8px;
            background: #ffffff;
            padding: 15px;
        }

        img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 6px;
            display: none;
            background: white;
        }

        .status {
            color: #64748b;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nano Banana Pro Engine</h1>
        <div class="subtitle">Direct, keyless integration via Puter.js.</div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search science topic (e.g., Photosynthesis)...">
            <button class="search-action" id="searchBtn">Generate Diagram</button>
        </div>
        
        <div class="result">
            <div id="status" class="status">Type an educational keyword.</div>
            <img id="image" alt="Educational Diagram">
        </div>
    </div>

    <script>
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('searchBtn');
        const status = document.getElementById('status');
        const img = document.getElementById('image');

        btn.addEventListener('click', async () => {
            const topic = input.value.trim();
            if (!topic) return;

            // Strict textbook styling prompt
            const engineeredPrompt = `highly accurate educational scientific textbook diagram of ${topic}, clean white background, vector graphic schematic style, clear English text labels with pointing arrows, no background clutter, academic, instructional`;

            status.style.display = 'block';
            status.textContent = 'Authenticating and generating...';
            img.style.display = 'none';
            btn.disabled = true;

            try {
                // Fetch the image using the specific Nano Banana Pro model identifier
                const returnedImgElement = await puter.ai.txt2img(engineeredPrompt, { 
                    model: "gemini-3-pro-image-preview" 
                });
                
                // Extract the src from the returned HTMLImageElement to preserve our custom UI styling
                img.src = returnedImgElement.src;
                
                img.onload = () => {
                    status.style.display = 'none';
                    img.style.display = 'block';
                    btn.disabled = false;
                };
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                btn.disabled = false;
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
